---
layout: default
---
<div class="post manuscript-home">
  <header class="landing-hero">
    <div class="landing-identity">
      <h1 class="landing-name">{{ site.first_name }}<br>{{ site.last_name }}</h1>
    </div>
    <div class="landing-description">
      {{ content }}
      {% if page.social %}
      <div class="social landing-social"><div class="contact-icons">{% include social.html %}</div></div>
      {% endif %}
    </div>
  </header>
  <article>
    {% if page.news and site.announcements.enabled %}
    <section class="manuscript-section home-news" aria-labelledby="news-title">
      <div class="section-heading"><h2 id="news-title">Recent news</h2><a href="{{ '/news/' | relative_url }}">All news <span aria-hidden="true">↗</span></a></div>
      {% include news.html %}
    </section>
    {% endif %}
  </article>
</div>
